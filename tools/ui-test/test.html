  var colors = ['#7b3fa0', '#1f6fa8', '#a8461f', '#2e8b57', '#8b2e5a', '#555'];
  function poster(id) {
    var c = colors[id.charCodeAt(1) % colors.length];
    return 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300"><rect width="200" height="300" fill="' + c + '"/><text x="100" y="160" font-size="40" text-anchor="middle" fill="white" font-family="sans-serif">' + id + '</text></svg>');
  }
  var ITEMS = {
    a1: { Id: 'a1', Type: 'Movie', Name: 'Dune: Part Two', ProductionYear: 2024, ImageTags: { Primary: 'x' }, UserData: { Played: false } },
    b2: { Id: 'b2', Type: 'Series', Name: 'Frieren', ProductionYear: 2023, ImageTags: { Primary: 'x' }, UserData: { Played: false, UnplayedItemCount: 12 } },
    c3: { Id: 'c3', Type: 'Episode', Name: 'The Kingdom', SeriesName: 'Shogun', SeriesId: 'd4', SeriesPrimaryImageTag: 'x', ParentIndexNumber: 1, IndexNumber: 3, UserData: { Played: false } },
    e5: { Id: 'e5', Type: 'Season', Name: 'Season 2', SeriesName: 'Arcane', SeriesId: 'e5', ImageTags: { Primary: 'x' }, UserData: { Played: false, UnplayedItemCount: 9 } },
    f6: { Id: 'f6', Type: 'Movie', Name: 'Oppenheimer – a very long title that should be cut off', ProductionYear: 2023, ImageTags: { Primary: 'x' }, UserData: { Played: true } },
    g7: { Id: 'g7', Type: 'Movie', Name: 'No Image Movie', ProductionYear: 2020, ImageTags: {}, UserData: { Played: false } }
  };
  // ---- Demo mode (README screenshots): fictional titles, generated posters ----
  if (P.get('demo')) {
    var DEMO_COLORS = [['#2b1055', '#7597de'], ['#0f2027', '#2c5364'], ['#42275a', '#734b6d'], ['#16222a', '#3a6073'], ['#3a1c71', '#d76d77'], ['#1d2b64', '#f8cdda'], ['#134e5e', '#71b280'], ['#4b134f', '#c94b4b'], ['#232526', '#414345'], ['#0b486b', '#f56217']];
    var DEMO_ICONS = { Movie: 'M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4z', Series: 'M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2m0 14H3V5h18z' };
    poster = function (id) {
      var item = ITEMS[id] || {};
      var c = DEMO_COLORS[(id.charCodeAt(0) * 3 + id.charCodeAt(1)) % DEMO_COLORS.length];
      var title = (item.SeriesName || item.Name || '').toUpperCase();
      var words = title.split(' '), lines = [], line = '';
      words.forEach(function (w) { if ((line + ' ' + w).trim().length > 11) { lines.push(line.trim()); line = w; } else { line += ' ' + w; } });
      lines.push(line.trim());
      var text = lines.slice(0, 3).map(function (l, i) { return '<text x="100" y="' + (205 + i * 26) + '" font-size="19" font-weight="700" text-anchor="middle" fill="white" font-family="Noto Sans, sans-serif" letter-spacing="0.5">' + l.replace(/&/g, '&amp;') + '</text>'; }).join('');
      var icon = DEMO_ICONS[item.Type === 'Movie' ? 'Movie' : 'Series'];
      return 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + c[0] + '"/><stop offset="1" stop-color="' + c[1] + '"/></linearGradient></defs><rect width="200" height="300" fill="url(#g)"/><circle cx="150" cy="60" r="70" fill="white" fill-opacity="0.07"/><g transform="translate(76 70) scale(2)" fill="white" fill-opacity="0.85"><path d="' + icon + '"/></g>' + text + '</svg>');
    };
    ITEMS = {
      m1: { Id: 'm1', Type: 'Movie', Name: 'The Last Lighthouse', ProductionYear: 2024, ImageTags: { Primary: 'x' }, UserData: { Played: false } },
      m2: { Id: 'm2', Type: 'Movie', Name: 'Paper Moon City', ProductionYear: 2023, ImageTags: { Primary: 'x' }, UserData: { Played: true } },
      m3: { Id: 'm3', Type: 'Movie', Name: 'Northbound', ProductionYear: 2022, ImageTags: { Primary: 'x' }, UserData: { Played: false } },
      m4: { Id: 'm4', Type: 'Movie', Name: 'Glass Garden', ProductionYear: 2025, ImageTags: { Primary: 'x' }, UserData: { Played: false } },
      m5: { Id: 'm5', Type: 'Movie', Name: 'Echoes of Tomorrow', ProductionYear: 2021, ImageTags: { Primary: 'x' }, UserData: { Played: false } },
      s1: { Id: 's1', Type: 'Series', Name: 'Starfall Academy', ProductionYear: 2023, ImageTags: { Primary: 'x' }, UserData: { Played: false, UnplayedItemCount: 12 } },
      s2: { Id: 's2', Type: 'Season', Name: 'Season 2', SeriesName: 'Harbor Lights', SeriesId: 's2', ImageTags: { Primary: 'x' }, UserData: { Played: false, UnplayedItemCount: 8 } },
      s3: { Id: 's3', Type: 'Episode', Name: 'The Long Night', SeriesName: 'Iron Valley', SeriesId: 's3', SeriesPrimaryImageTag: 'x', ParentIndexNumber: 1, IndexNumber: 4, UserData: { Played: false } },
      s4: { Id: 's4', Type: 'Series', Name: 'Midnight Bakery', ProductionYear: 2024, ImageTags: { Primary: 'x' }, UserData: { Played: false, UnplayedItemCount: 24 } },
      a1: { Id: 'a1', Type: 'Series', Name: 'Sky Pirates', ProductionYear: 2022, ImageTags: { Primary: 'x' }, UserData: { Played: false, UnplayedItemCount: 13 } },
      a2: { Id: 'a2', Type: 'Series', Name: 'Moonlit Blade', ProductionYear: 2025, ImageTags: { Primary: 'x' }, UserData: { Played: false, UnplayedItemCount: 10 } },
      a3: { Id: 'a3', Type: 'Movie', Name: 'Spirit Train', ProductionYear: 2020, ImageTags: { Primary: 'x' }, UserData: { Played: false } }
    };
    var D = function (id, h) { return { itemId: id, addedAt: '2026-10-31T' + (10 + h) + ':00:00Z' }; };
    var LIST = { version: 1, categories: [
      { id: 'c-1', name: 'Watch later', isDefault: true, items: [D('m1', 9), D('s1', 8), D('m2', 7), D('s2', 6), D('m3', 5), D('s3', 4), D('m4', 3), D('s4', 2), D('m5', 1)] },
      { id: 'c-2', name: 'Anime', items: [D('a1', 3), D('a2', 2), D('a3', 1)] },
      { id: 'c-3', name: 'Rewatch', items: [D('m2', 1)] },
      { id: 'c-4', name: 'Movie night', items: [] }
    ] };
  }
  if (!P.get('demo')) var LIST = { version: 1, categories: [
    { id: 'c-1', name: 'Später ansehen', isDefault: true, items: [{ itemId: 'b2', addedAt: '2026-10-31T11:00:00Z' }, { itemId: 'e5', addedAt: '2026-10-31T11:30:00Z' }].concat( [{ itemId: 'a1', addedAt: '2026-10-30T10:00:00Z' }, { itemId: 'c3', addedAt: '2026-10-31T10:00:00Z' }, { itemId: 'f6', addedAt: '2026-10-29T10:00:00Z' }, { itemId: 'g7', addedAt: '2026-10-28T10:00:00Z' }]) },
    { id: 'c-2', name: 'Anime', items: [{ itemId: 'b2', addedAt: '2026-10-31T09:00:00Z' }, { itemId: 'e5', addedAt: '2026-10-31T08:00:00Z' }] },
    { id: 'c-3', name: 'Movie night', items: [] }
  ] };
  // many=1: lots of items to check the "All" preview limit
  if (P.get('many')) {
    for (var n = 0; n < 14; n++) {
      ITEMS['x' + n] = { Id: 'x' + n, Type: 'Movie', Name: 'Movie ' + n, ProductionYear: 2000 + n, ImageTags: { Primary: 'x' }, UserData: { Played: false } };
      LIST.categories[0].items.push({ itemId: 'x' + n, addedAt: '2026-11-01T' + String(10 + n).padStart(2, '0') + ':00:00Z' });
    }
    for (var k = 0; k < 11; k++) {
      ITEMS['y' + k] = { Id: 'y' + k, Type: 'Series', Name: 'Show ' + k, ProductionYear: 2010 + k, ImageTags: { Primary: 'x' }, UserData: { Played: false } };
      LIST.categories[1].items.push({ itemId: 'y' + k, addedAt: '2026-11-02T' + String(10 + k).padStart(2, '0') + ':00:00Z' });
    }
  }
  window.ApiClient = {
    accessToken: function () { return 't'; },
    getCurrentUserId: function () { return 'u1'; },
    serverId: function () { return 's1'; },
    getUrl: function (path, params) {
      var m = /Items\/(\w+)\/Images/.exec(path);
      if (m) return poster(m[1]);
      return 'mock://' + path + (params ? '?' + new URLSearchParams(params) : '');
    }
  };
  function json(o) { return Promise.resolve(new Response(JSON.stringify(o), { status: 200, headers: { 'Content-Type': 'application/json' } })); }
  window.fetch = function (url, opts) {
    url = String(url);
    var method = (opts && opts.method) || 'GET';
    if (url.indexOf('mock://Items?') === 0) {
      var ids = new URL(url.replace('mock://', 'http://x/')).searchParams.get('ids').split(',');
      return json({ Items: ids.map(function (i) { return ITEMS[i]; }).filter(Boolean) });
    }
    if (url === 'mock://Watchlist' && method === 'GET') return json(LIST);
    var mi = /mock:\/\/Watchlist\/Items\/(\w+)/.exec(url);
    if (mi) {
      var want = JSON.parse(opts.body).categoryIds;
      LIST.categories.forEach(function (c) {
        var has = c.items.some(function (e) { return e.itemId === mi[1]; });
        if (want.indexOf(c.id) !== -1 && !has) c.items.push({ itemId: mi[1], addedAt: new Date().toISOString() });
        if (want.indexOf(c.id) === -1 && has) c.items = c.items.filter(function (e) { return e.itemId !== mi[1]; });
      });
      return json(LIST);
    }
    if (url === 'mock://Watchlist/Categories' && method === 'POST') {
      var cat = { id: 'c-' + Date.now(), name: JSON.parse(opts.body).name, items: [] };
      LIST.categories.push(cat);
      return json(cat);
    }
    return Promise.resolve(new Response(null, { status: 204 }));
  };
</script>

<script>
  // ---- Drive the UI for the screenshot ----
  setTimeout(function () {
    if (MODE === 'tab' || MODE === 'manage') {
      document.querySelector('.wlTabButton').click();
      if (MODE === 'manage') setTimeout(function () { document.querySelector('[data-wl-action=manage]').click(); }, 400);
    } else if (MODE === 'dialog') {
      document.querySelector('.btnUserRating + .wlBookmarkBtn').click();
    } else if (MODE === 'showall') {
      document.querySelector('.wlTabButton').click();
      setTimeout(function () { document.querySelector('.wlMore').click(); }, 500);
    } else if (MODE === 'collapse') {
      document.querySelector('.wlTabButton').click();
      setTimeout(function () { document.querySelector('[data-wl-group="movies"] > summary').click(); }, 500);
    } else if (MODE === 'modernnav') {
      document.querySelector('#modernBar .wlNavLink').click();
    } else if (MODE === 'modernfav') {
      // open watchlist, then go to favorites like Jellyfin would (tab bar selects index 1)
      document.querySelector('#modernBar .wlNavLink').click();
      setTimeout(function () {
        location.hash = '#/home?tab=1';
        var fav = document.querySelector('.emby-tab-button[data-index="1"]');
        var tabs = document.querySelector('.emby-tabs');
        var cur = tabs.querySelector('.emby-tab-button-active');
        cur.classList.remove('emby-tab-button-active'); fav.classList.add('emby-tab-button-active');
        tabs.dispatchEvent(new CustomEvent('beforetabchange', { detail: { selectedTabIndex: 1, previousIndex: 2 } }));
        document.querySelectorAll('#indexPage > .tabContent').forEach(function (t) { t.classList.toggle('is-active', t.id === 'favoritesTab'); });
      }, 700);
    } else if (MODE === 'legacyback') {
      // Legacy: tab active, then tabs re-rendered by mainTabsManager (our button gone, Home selected again)
      document.querySelector('.wlTabButton').click();
      setTimeout(function () {
        var slider = document.querySelector('.emby-tabs-slider');
        slider.innerHTML = '<button type="button" class="emby-tab-button emby-button emby-tab-button-active" data-index="0"><div class="emby-button-foreground">Home</div></button><button type="button" class="emby-tab-button emby-button" data-index="1"><div class="emby-button-foreground">Favorites</div></button>';
        document.querySelector('#homeTab').classList.add('is-active');
      }, 600);
    }
  }, 600);
  setTimeout(function () {
    var r = {
      tab: !!document.querySelector('.wlTabButton'),
      bookmarks: document.querySelectorAll('.wlBookmarkBtn').length,
      active: Array.from(document.querySelectorAll('.wlBookmarkBtn.wlActive')).map(function (b) { return b.getAttribute('data-wl-id'); }),
      visibleTabs: Array.from(document.querySelectorAll('#indexPage > .tabContent')).filter(function (t) { return getComputedStyle(t).display !== 'none'; }).map(function (t) { return t.id || t.className; }),
      light: document.documentElement.classList.contains('wl-light'),
      more: Array.from(document.querySelectorAll('.wlMore')).map(function (m) { return m.textContent.trim(); }),
      sections: Array.from(document.querySelectorAll('.wlSection')).map(function (sec) { return sec.querySelector('.wlSectionTitle button').textContent + ':' + sec.querySelectorAll('.wlCard').length; }),
      firstCards: Array.from(document.querySelectorAll('.wlSection:first-of-type .wlGroup[data-wl-group=movies] .wlCardTitle')).slice(0, 3).map(function (c) { return c.textContent; }),
      groups: Array.from(document.querySelectorAll('.wlGroup')).map(function (g) { return g.getAttribute('data-wl-group') + ':' + g.querySelectorAll('.wlCard').length + (g.open ? ':open' : ':closed'); }),
      prefs: (function () { try { return JSON.parse(localStorage.getItem('watchlist-prefs') || '{}').collapsed; } catch (e) { return null; } })(),
      navLinks: Array.from(document.querySelectorAll('.wlNavLink')).map(function (l) { return l.textContent.trim() + '|' + l.getAttribute('href') + (l.classList.contains('wlNavLink-active') ? '|active' : ''); })
    };
    document.title = 'RESULT ' + JSON.stringify(r);
  }, 2200);
</script>
